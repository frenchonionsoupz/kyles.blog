<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcfbf7">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}kyles.blog</title>
  <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}This little internet hellscape is the best online representation of my messy brain.{% endif %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="kyles.blog RSS" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="top-links"><a href="https://kylewrites.com" target="_blank" rel="noopener noreferrer">visit website ↗</a></div>
      <a href="{{ '/' | relative_url }}" class="brand" aria-label="kyles.blog home">kyles<span class="accent">.blog</span></a>
      <nav class="site-nav" aria-label="Site navigation"><a href="{{ '/hyperlinks/' | relative_url }}">Hyperlinks</a></nav>
    </header>
    <main>{{ content }}</main>
    {% unless page.url == "/" %}
    <section class="subscribe-box" aria-labelledby="subscribe-heading">
      <p class="subscribe-label" id="subscribe-heading">Get new posts by email</p>
      <p class="subscribe-copy">New writing, most days.</p>
      <div class="kit-embed" id="kit-signup">
        <script async data-uid="ab42a40fe0" src="https://learning-freelance.kit.com/ab42a40fe0/index.js"></script>
      </div>
    </section>
    {% endunless %}
    <footer>© {{ site.time | date: "%Y" }} kyles.blog · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></footer>
  </div>
</body>
</html>
